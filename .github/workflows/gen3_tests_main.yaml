              #     Postgres:
              #       Host: funnel-postgresql.default.svc.cluster.local
              #       Database: funnel
              #       User: funnel
              #       Password: example

              cat <<EOF > zzz-disable-services.yaml
              access-backend:
                enabled: false
              ambassador:
                enabled: false
              argo-wrapper::
                enabled: false
              audit:
                enabled: false
              cedar:
                enabled: false
              cohort-middleware:
                enabled: false
              dicom-server:
                enabled: false
              etl:
                enabled: false
              frontend-framework:
                enabled: false
              gen3-user-data-library:
                enabled: false
              guppy:
                enabled: false
              hatchery:
                enabled: false
              manifestservice:
                enabled: false
              metadata:
                enabled: false
              ohif-viewer:
                enabled: false
              orthanc:
                enabled: false
              peregrine:
                enabled: false
              portal:
                enabled: false
              requestor:
                enabled: false
              sheepdog:
                enabled: false
              sower:
                enabled: false
              ssjdispatcher:
                enabled: false
              wts:
                enabled: false
              EOF

          # Apply the changes to the manifest of the selected CI environment, roll the pods and run usersync
          # Generate API keys for test users for the environment
          - name: Prepare CI environment
            id: prep_ci_env
            if: ${{ env.SKIP_TESTS != 'true' && (steps.create_ns.outcome == 'success' || steps.select_ci_env.outcome == 'success') }}
            continue-on-error: true  # if this fails, we still need to run clean-up steps
            run: |
              echo $UPDATED_FOLDERS
              mkdir $HOME/.gen3
              mkdir logs
              echo "****** Prepare CI Environment ******" > logs/gh_action_logs.txt
              if ! poetry run python -m gen3_ci.scripts.prepare_ci_environment >> logs/gh_action_logs.txt 2>&1; then
                echo "PR_ERROR_MSG=Failed to Prepare CI environment" >> $GITHUB_ENV
                exit 1
              fi

          # This is used for running specific test suites by labeling the PR with the test class
          # Multiple suites can be executed by adding multiple labels
          - name: Get test labels
            id: get_test_labels
            if: ${{ env.SKIP_TESTS != 'true' && steps.prep_ci_env.outcome == 'success' }}
            continue-on-error: true  # if this fails, we still need to run clean-up steps
            run: |
              if [[ -n $TEST_LABELS ]]; then
                test_label_expr="${TEST_LABELS//,/ or }"
                test_label="-k \"$test_label_expr\""
              else
                if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
                  test_label=$(gh api repos/$REPO_FN/pulls/$PR_NUM --jq '.labels | map(select(.name | test("^(?i)test"))) | map(.name) | if length > 0 then "-k \"" + join(" or ") + "\"" else "" end')
                fi
              fi
              echo $test_label
              echo "TEST_LABEL=$test_label" >> $GITHUB_ENV

          - name: Run tests pertaining to specific service
            id: run_service_tests
            if: ${{ env.SKIP_TESTS != 'true' && inputs.SERVICE_TO_TEST && steps.prep_ci_env.outcome == 'success' }}
            continue-on-error: true  # if this fails, we still need to run clean-up steps
            run: |
              echo -e "\n\n************ Run tests ************" >> logs/gh_action_logs.txt
              mkdir output
              poetry run pytest -n logical -m "${{ inputs.SERVICE_TO_TEST }} and not wip" --alluredir allure-results --no-header --dist loadscope ${{ env.TEST_LABEL }} >> logs/gh_action_logs.txt 2>&1
              if [ $? -ne 0 ]; then
                echo "PR_ERROR_MSG=Test(s) failures encountered in PR" >> $GITHUB_ENV
              fi

          - name: Run tests
            id: run_tests
            if: ${{ env.SKIP_TESTS != 'true' && !inputs.SERVICE_TO_TEST && steps.prep_ci_env.outcome == 'success' }}
            continue-on-error: true  # if this fails, we still need to run clean-up steps
            run: |
              echo -e "\n\n************ Run tests ************" >> logs/gh_action_logs.txt
              mkdir output
              poetry run pytest -n logical -m "not wip" --alluredir allure-results --no-header --dist loadscope ${{ env.TEST_LABEL }} >> logs/gh_action_logs.txt 2>&1
              if [ $? -ne 0 ]; then
                echo "PR_ERROR_MSG=Test(s) failures encountered in PR" >> $GITHUB_ENV
              fi

          - name: Generate allure report
            id: generate_allure_report
            if: ${{ env.SKIP_TESTS != 'true' && steps.run_service_tests.outcome == 'success' || steps.run_service_tests.outcome == 'failure' || steps.run_tests.outcome == 'success' || steps.run_tests.outcome == 'failure' }}
            continue-on-error: true  # if this fails, we still need to run clean-up steps
            run: |
              npm install -g allure-commandline --save-dev
              allure generate allure-results -o allure-report --clean
              if [ $? -ne 0 ]; then
                echo "PR_ERROR_MSG=Failed to generate allure report" >> $GITHUB_ENV
              fi

          - name: Upload allure report to S3
            id: upload_allure_report
            if: ${{ env.SKIP_TESTS != 'true' && steps.generate_allure_report.outcome == 'success' }}
            continue-on-error: true  # if this fails, we still need to run clean-up steps
            run: |
              echo -e "\n\n******* Upload reports to S3 *******" >> logs/gh_action_logs.txt
              if [[ "$IS_NIGHTLY_RUN" == "true" ]]; then
                DATE=$(date +%Y%m%d)
                aws s3 sync ./allure-report s3://ci-allure-reports/nightly-run/$DATE >> logs/gh_action_logs.txt 2>&1
              else
                aws s3 sync ./allure-report s3://ci-allure-reports/$REPO/$PR_NUM/$RUN_NUM/$ATTEMPT_NUM >> logs/gh_action_logs.txt 2>&1
              fi
              if [ $? -ne 0 ]; then
                echo "PR_ERROR_MSG=Failed to upload allure report to s3 bucket" >> $GITHUB_ENV
              fi

          - name: Print logs
            id: print_logs
            if: ${{ env.SKIP_TESTS != 'true' }}
            continue-on-error: true  # if this fails, we still need to run clean-up steps
            run: |
              echo Logs:
              cat logs/gh_action_logs.txt

          - name: Upload logs to S3
            id: upload_gh_action_logs
            if: ${{ env.SKIP_TESTS != 'true' && (steps.prep_ci_env.outcome == 'success' || steps.prep_ci_env.outcome == 'failure') }}
            continue-on-error: true  # if this fails, we still need to run clean-up steps
            run: |
              echo -e "\n\n******** Upload logs to S3 ********" >> logs/gh_action_logs.txt
              if [[ "$IS_NIGHTLY_RUN" == "true" ]]; then
                DATE=$(date +%Y%m%d)
                aws s3 sync ./logs s3://ci-allure-reports/nightly-run/$DATE >> logs/gh_action_logs.txt 2>&1
              else
                aws s3 sync ./logs s3://ci-allure-reports/$REPO/$PR_NUM/$RUN_NUM/$ATTEMPT_NUM >> logs/gh_action_logs.txt 2>&1
              fi
              if [ $? -ne 0 ]; then
                echo "PR_ERROR_MSG=Failed to upload allure report to s3 bucket" >> $GITHUB_ENV
              fi

          - name: Generate markdown report
            id: generate_md_report
            if: ${{ env.SKIP_TESTS != 'true' && (steps.upload_allure_report.outcome == 'success' || steps.upload_gh_action_logs.outcome == 'success') }}
            continue-on-error: true
            # It is possible for env is prepped but tests error out, the pod logs will help in debugging env issues
            run: |
              if [ -n "${{ env.PR_ERROR_MSG }}" ]; then
                if [ ! -f output/report.md ]; then
                  mkdir output
                  touch output/report.md
                fi
                echo -e "\n${{ env.PR_ERROR_MSG }}" >> output/report.md
              fi
              if [ "${{ steps.upload_allure_report.outcome }}" == "success" ]; then
                if [[ "$IS_NIGHTLY_RUN" == "true" ]]; then
                  DATE=$(date +%Y%m%d)
                  echo -e "\nPlease find the detailed integration test report [here](https://allure.ci.planx-pla.net/nightly-run/$DATE/index.html)" >> output/report.md
                else
                  echo -e "\nPlease find the detailed integration test report [here](https://allure.ci.planx-pla.net/$REPO/$PR_NUM/$RUN_NUM/$ATTEMPT_NUM/index.html)" >> output/report.md
                fi
              fi
              if [ "${{ steps.upload_gh_action_logs.outcome }}" == "success" ]; then
                if [[ "$IS_NIGHTLY_RUN" == "true" ]]; then
                  DATE=$(date +%Y%m%d)
                  echo -e "\nPlease find the Github Action logs [here](https://allure.ci.planx-pla.net/nightly-run/$DATE/gh_action_logs.txt)" >> output/report.md
                else
                  echo -e "\nPlease find the Github Action logs [here](https://allure.ci.planx-pla.net/$REPO/$PR_NUM/$RUN_NUM/$ATTEMPT_NUM/gh_action_logs.txt)" >> output/report.md
                fi
              fi

          - name: Render report to the PR
            id: publish_md_report
            if: ${{ env.SKIP_TESTS != 'true' && github.event_name == 'pull_request' && (steps.upload_allure_report.outcome == 'success' || steps.upload_gh_action_logs.outcome == 'success') }}
            continue-on-error: true  # if this fails, we still need to run clean-up steps
            run: gh pr comment $PR_NUM --body-file output/report.md -R $REPO_FN
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          - name: Generate Slack report
            id: generate_slack_report
            if: ${{ env.SKIP_TESTS != 'true' && (steps.upload_allure_report.outcome == 'success' || steps.upload_gh_action_logs.outcome == 'success') }}
            continue-on-error: true # if this fails, we still need to run clean-up steps
            run: poetry run python -m gen3_ci.scripts.generate_slack_report

          - name: Publish report to Slack
            id: slack_notify
            if: ${{ env.SKIP_TESTS != 'true' && steps.generate_slack_report.outcome == 'success' }}
            continue-on-error: true  # if this fails, we still need to run clean-up steps
            uses: slackapi/slack-github-action@v2.0.0
            with:
              method: chat.postMessage
              token: ${{ secrets.CI_SLACK_BOT_TOKEN }}
              payload-file-path: "./${{ inputs.WORKING_DIR }}/slack_report.json"
              payload-templated: true

          - name: Mark workflow as failed for unsuccessful test runs
            if: ${{ env.SKIP_TESTS != 'true' && steps.run_service_tests.outcome != 'success' && steps.run_tests.outcome != 'success' }}
            run: echo "Test run was unsuccessful, marking workflow as failed" && exit 1

          - name: Cleanup
            if: ${{ env.SKIP_TESTS != 'true' }}
            run: |
              poetry run python -m gen3_ci.scripts.teardown_ci_env